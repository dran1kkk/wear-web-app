plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.wearapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.wearapp"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.wear:wear:1.3.0'
}
